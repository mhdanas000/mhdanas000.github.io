<head>

<body class="bg-white text-[#0B121B] antialiased selection:bg-[#175D99] selection:text-white">
  <div id="root"></div>
  <script>
    // Helpful diagnostic if opened directly via file:// or a static server (e.g. Live Server) instead of Vite
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        root.innerHTML =
          '<div style="font-family:Inter,system-ui,sans-serif;max-width:560px;margin:80px auto;padding:32px;border:1px solid #DCE3EC;background:#F6F8FB;color:#0B121B;">' +
          '<h2 style="margin:0 0 10px;color:#175D99;">ECO &amp; LUX — Open via Vite Server</h2>' +
          '<p style="margin:0 0 16px;line-height:1.6;color:#475569;">This React + Vite application cannot run from a static file or Live Server because JSX must be compiled by Vite. Make sure <code>npm run dev</code> is running in the project folder, then open:</p>' +
          '<a href="http://localhost:5173/" style="display:inline-block;background:#175D99;color:#fff;padding:12px 20px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:0.06em;">OPEN HTTP://LOCALHOST:5173/</a>' +
          '</div>';
      }
    }, 1500);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
